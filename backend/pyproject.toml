
[project]
name = "housing-price-ai"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "flask-cors>=4.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "pydantic>=2.0",
    "scikit-learn>=1.6,<1.9",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "email-validator>=2.0",
]

[tool.vercel]
entrypoint = "fastapi_app:app"
